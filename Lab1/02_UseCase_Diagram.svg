<svg viewBox="0 0 1060 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="1060" height="720" fill="#ffffff"/>

  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666666"/>
    </marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444444"/>
    </marker>
  </defs>

  <!-- System boundary (rounded, light fill like reference) -->
  <rect x="210" y="50" width="800" height="620" rx="16" ry="16" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.4"/>
  <text x="610" y="82" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Patient Health Record Consent Management System</text>

  <!-- ===================== ASSOCIATIONS (drawn first, under actors/ovals) ===================== -->
  <g stroke="#707070" stroke-width="1.4" marker-end="url(#arrowGray)">
    <line x1="112" y1="188" x2="270" y2="132"/>
    <line x1="112" y1="188" x2="280" y2="222"/>
    <line x1="112" y1="188" x2="285" y2="308"/>
    <line x1="112" y1="428" x2="525" y2="410"/>
    <line x1="112" y1="628" x2="510" y2="610"/>
  </g>

  <!-- ===================== <<include>> relationship ===================== -->
  <line x1="820" y1="428" x2="875" y2="502" stroke="#444444" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>
  <text x="895" y="462" font-size="12" font-style="italic" fill="#333333" text-anchor="middle" transform="rotate(50 895 462)">&lt;&lt;include&gt;&gt;</text>

  <!-- ===================== ACTORS ===================== -->
  <!-- Patient -->
  <g stroke="#1a1a1a" stroke-width="1.8" fill="none">
    <circle cx="90" cy="160" r="14" fill="#ffffff"/>
    <line x1="90" y1="174" x2="90" y2="215"/>
    <line x1="70" y1="188" x2="110" y2="188"/>
    <line x1="90" y1="215" x2="72" y2="250"/>
    <line x1="90" y1="215" x2="108" y2="250"/>
  </g>
  <text x="90" y="268" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Patient</text>

  <!-- Clinic Doctor -->
  <g stroke="#1a1a1a" stroke-width="1.8" fill="none">
    <circle cx="90" cy="400" r="14" fill="#ffffff"/>
    <line x1="90" y1="414" x2="90" y2="455"/>
    <line x1="70" y1="428" x2="110" y2="428"/>
    <line x1="90" y1="455" x2="72" y2="490"/>
    <line x1="90" y1="455" x2="108" y2="490"/>
  </g>
  <text x="90" y="508" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Clinic Doctor</text>

  <!-- Clinic Administrator -->
  <g stroke="#1a1a1a" stroke-width="1.8" fill="none">
    <circle cx="90" cy="600" r="14" fill="#ffffff"/>
    <line x1="90" y1="614" x2="90" y2="655"/>
    <line x1="70" y1="628" x2="110" y2="628"/>
    <line x1="90" y1="655" x2="72" y2="690"/>
    <line x1="90" y1="655" x2="108" y2="690"/>
  </g>
  <text x="90" y="705" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Clinic Administrator</text>

  <!-- ===================== USE CASES ===================== -->
  <!-- UC-01 -->
  <ellipse cx="420" cy="130" rx="145" ry="38" fill="#AED2EF" stroke="#3E6B96" stroke-width="1.4"/>
  <text x="420" y="123" font-size="12.5" font-weight="bold" fill="#16324a" text-anchor="middle">UC-01</text>
  <text x="420" y="140" font-size="12" fill="#16324a" text-anchor="middle">Grant Time-Bounded Consent</text>

  <!-- UC-02 -->
  <ellipse cx="420" cy="220" rx="135" ry="38" fill="#AED2EF" stroke="#3E6B96" stroke-width="1.4"/>
  <text x="420" y="213" font-size="12.5" font-weight="bold" fill="#16324a" text-anchor="middle">UC-02</text>
  <text x="420" y="230" font-size="12" fill="#16324a" text-anchor="middle">Revoke Active Consent</text>

  <!-- UC-03 -->
  <ellipse cx="420" cy="310" rx="130" ry="38" fill="#AED2EF" stroke="#3E6B96" stroke-width="1.4"/>
  <text x="420" y="303" font-size="12.5" font-weight="bold" fill="#16324a" text-anchor="middle">UC-03</text>
  <text x="420" y="320" font-size="12" fill="#16324a" text-anchor="middle">View Consent Registry</text>

  <!-- UC-04 -->
  <ellipse cx="680" cy="410" rx="150" ry="40" fill="#AED2EF" stroke="#3E6B96" stroke-width="1.4"/>
  <text x="680" y="403" font-size="12.5" font-weight="bold" fill="#16324a" text-anchor="middle">UC-04</text>
  <text x="680" y="420" font-size="12" fill="#16324a" text-anchor="middle">Access Diagnostic Records</text>

  <!-- UC-05 -->
  <ellipse cx="680" cy="610" rx="165" ry="40" fill="#AED2EF" stroke="#3E6B96" stroke-width="1.4"/>
  <text x="680" y="603" font-size="12.5" font-weight="bold" fill="#16324a" text-anchor="middle">UC-05</text>
  <text x="680" y="620" font-size="12" fill="#16324a" text-anchor="middle">Manage Doctor Verification</text>

  <!-- Verify Active Consent (include target - tan, like "Authenticate User" in reference) -->
  <ellipse cx="930" cy="530" rx="80" ry="30" fill="#F6DFB4" stroke="#B8860B" stroke-width="1.4"/>
  <text x="930" y="534" font-size="11" fill="#5a4210" text-anchor="middle">Verify Active Consent</text>

</svg>
